<title id="title">prompt-pipeline-core</title>
<desc id="desc">Browser-side encryption you can verify, byte for byte. A readable sheet is locked into ciphertext, and the fingerprint of the served file matches the published one. Argon2id, AES-256-GCM, Apache-2.0.</desc>
