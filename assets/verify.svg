<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1487" width="1280" height="1487" role="img" aria-labelledby="title desc">
<title id="title">Check it yourself in three ways</title>
<desc id="desc">The file served by the site under /core/&lt;version&gt;/ is hashed with SHA-256 and compared with the official fingerprint published on GitHub in releases/&lt;version&gt;/SHA256SUMS: identical means the site runs exactly this code. Three ways, from quick to strongest: one click in the app; one command run outside the browser, the independent proof; or rebuild it from source.</desc>
