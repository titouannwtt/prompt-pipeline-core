<text class="m" x="678.0" y="402" font-size="20" text-anchor="middle" fill="#5e6779">AES-256-GCM</text>
<g transform="translate(69.0 469.0) scale(1.0833)" fill="none" stroke="#2433c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></g>
<text class="t" x="108" y="491" font-size="24" font-weight="700" fill="#0e1320">Non-extractable: scripts cannot read its bytes.</text>
