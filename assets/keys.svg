<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
<title id="title">The keys never leave your hands</title>
<desc id="desc">Your passphrase goes through Argon2id in a Web Worker and becomes a non-extractable AES-256-GCM key that stays in your browser. Only ciphertext reaches the server: in Sovereign mode it holds nothing that can decrypt. In Managed mode a wrapped copy of the key is kept for recovery, so the operator can decrypt.</desc>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:no-preference){
.flow{stroke-dasharray:5 9;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes blink{50%{opacity:0}}
}
</style>
<rect x="1" y="1" width="1278" height="758" rx="24" fill="#f3f5f8" stroke="#dfe3ea" stroke-width="2"/>
<text class="m" x="64" y="70" font-size="20" font-weight="700" letter-spacing="2" fill="#2433c8">KEYS</text>
<text class="t" x="64" y="128" font-size="44" font-weight="700" fill="#0e1320">The keys never leave your hands.</text>
<rect x="38" y="176" width="766" height="352" rx="20" fill="#e8eafb" fill-opacity=".55" stroke="#2433c8" stroke-width="2" stroke-dasharray="8 6"/>
