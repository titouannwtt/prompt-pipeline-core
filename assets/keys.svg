<rect x="880" y="176" width="352" height="352" rx="20" fill="#ffffff" stroke="#c7cdd7" stroke-width="1.5"/>
<text class="m" x="908" y="216" font-size="18" font-weight="700" letter-spacing="1.5" fill="#16714e">SOVEREIGN MODE</text>
<g transform="translate(910.0 254.0) scale(2.1667)" fill="none" stroke="#0e1320" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.2a4.1 4.1 0 0 0 .5-8.2A5.6 5.6 0 0 0 6.9 9.4 4.6 4.6 0 0 0 7 18.5z"/></g>
<text class="t" x="980" y="274" font-size="26" font-weight="700" fill="#0e1320">Server</text>
<text class="t" x="980" y="304" font-size="22" fill="#465064">stores ciphertext</text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.690;1" dur="1.45s" fill="freeze"/>
<rect x="904" y="356" width="304" height="132" rx="14" fill="#e1f1e9"/>
<g transform="translate(924.0 402.0) scale(1.6667)" fill="none" stroke="#16714e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5l8.5-8.5M16.5 7l2.5 2.5M14 9.5l2 2"/><path d="M3 3l18 18"/></g>
<text class="t" x="980" y="414" font-size="26" font-weight="700" fill="#16714e">Nothing that</text>
<text class="t" x="980" y="448" font-size="26" font-weight="700" fill="#16714e">can decrypt.</text>
</g>
<rect x="38" y="568" width="1204" height="156" rx="18" fill="#faefdc" stroke="#9e5c00" stroke-width="1.5"/>
<g transform="translate(66.0 620.0) scale(2.1667)" fill="none" stroke="#9e5c00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></g>
<text class="m" x="146" y="618" font-size="18" font-weight="700" letter-spacing="1.5" fill="#9e5c00">MANAGED MODE</text>
<text class="t" x="146" y="658" font-size="26" font-weight="700" fill="#0e1320">A wrapped copy of the key is kept for recovery,</text>
<text class="t" x="146" y="694" font-size="26" font-weight="700" fill="#9e5c00">so the operator CAN decrypt. You choose.</text>
<circle cx="900" cy="634" r="30" fill="#ffffff" stroke="#9e5c00" stroke-width="1.5"/>
