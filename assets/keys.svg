<circle cx="192" cy="306" r="5" fill="#0e1320"/>
<circle cx="212" cy="306" r="5" fill="#0e1320"/>
<rect x="228" y="292" width="2.5" height="28" fill="#2433c8" class="blink"/>
<text class="t" x="164.0" y="372" font-size="24" font-weight="700" text-anchor="middle" fill="#0e1320">Passphrase</text>
<text class="t" x="164.0" y="402" font-size="20" text-anchor="middle" fill="#5e6779">only you know it</text>
<rect x="334" y="236" width="172" height="200" rx="16" fill="#ffffff" stroke="#c7cdd7" stroke-width="1.5"/>
<g transform="translate(396.0 282.0) scale(2.0000)" fill="none" stroke="#0e1320" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21"/></g>
<text class="t" x="420.0" y="372" font-size="24" font-weight="700" text-anchor="middle" fill="#0e1320">Argon2id</text>
<text class="t" x="420.0" y="402" font-size="20" text-anchor="middle" fill="#5e6779">in a Worker</text>
<rect x="576" y="236" width="204" height="200" rx="16" fill="#ffffff" stroke="#2433c8" stroke-width="2.5"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="1.05s" fill="freeze"/>
