<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
<title id="title">With prompt-pipeline-core, your data is encrypted before it leaves your browser</title>
<desc id="desc">You type in your browser; prompt-pipeline-core encrypts it right there. The copy saved on this device and the copy on the sync server (Supabase) are ciphertext only. Your other device decrypts it with the same passphrase. Separate path: connectors (SSH, AI, FTP) pass through the relay in clear to the destination you chose, never stored.</desc>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:no-preference){
.flow{stroke-dasharray:5 9;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes blink{50%{opacity:0}}
}
</style>
