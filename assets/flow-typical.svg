<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
<title id="title">On most sites, your data is readable at every step</title>
<desc id="desc">Your browser sends plain text over HTTPS, which only protects the trip. The server, the database (even when encrypted at rest, the host holds the keys), backups, logs and admins can all read it.</desc>
